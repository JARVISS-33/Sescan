server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Neon free database sleeps when idle: allow time to wake up and avoid stale connections
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# Login for the tool (set both in Railway variables; the app refuses to start without them)
app.password=${APP_PASSWORD}
app.secret=${APP_SECRET}
app.max-pages=${MAX_PAGES:40}
